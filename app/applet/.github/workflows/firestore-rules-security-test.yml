name: "Firestore Rules Security CI (Isolated Emulator)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Candidate Rules Existence & Checksum
        run: |
          CANDIDATE="firestore.unified.candidate.rules"
          EXPECTED_HASH="8bbe788edcd9b6d58d20fa0f8c949acc84ac50b0c116370bea1c2b23675b9aba"
          
          if [ ! -f "$CANDIDATE" ]; then
            echo "::error::Candidate rules file $CANDIDATE not found!"
            exit 1
          fi
          
          ACTUAL_HASH=$(sha256sum "$CANDIDATE" | awk '{print $1}')
          echo "Computed SHA-256: $ACTUAL_HASH"
          
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Checksum mismatch! Expected $EXPECTED_HASH, got $ACTUAL_HASH"
            exit 1
          fi
          echo "Candidate cryptographic integrity verified successfully."

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install Firebase CLI Pinned
        run: |
          npm install -g firebase-tools@13.15.4

      - name: Run Firestore Security Rules Tests (Demo Project)
        env:
          GCP_PROJECT: demo-palm-metric-security
          FIRESTORE_EMULATOR_HOST: localhost:8080
        run: |
          # Copy candidate rules to firestore.rules for emulator execution in test mode
          cp firestore.unified.candidate.rules firestore.rules
          
          # Execute test suite using Firebase Emulator
          firebase emulators:exec --project demo-palm-metric-security --only firestore "npm test"

      - name: Archive Test Results & Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-security-test-reports
          path: |
            test-results/
            coverage/
            *.log
          retention-days: 7
